name: Bug report
description: 自托管 API 服务问题反馈
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        这个仓库的 `main` 分支只维护 Image-Studio-API 自托管服务、后台、Docker 和 skill。

        如果是原桌面端、Android 端、Cloudflare Worker 或安装包问题，请先看原作者仓库:
        https://github.com/RoseKhlifa/Image-Studio

        如果问题来自上游 `BASE_URL`、API Key 权限、账户余额、IP 白名单、模型未开通、relay 兼容性或服务商临时故障，请先完成自查。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我确认问题发生在本仓库的自托管 API 服务、后台、Docker 或 skill 中。
          required: true
        - label: 我已经确认这不是上游 BASE_URL、API Key、模型权限、余额、白名单或 relay 兼容性问题。
          required: true
        - label: 我已经查看过 `/data/logs`、HTTP raw 响应或后台错误信息，并已脱敏。
          required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - Direct Node
        - Other container runtime
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: API 版本 / 镜像 tag / commit
      description: 例如 v1.2.5、latest、或 commit SHA
      placeholder: v1.2.5
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: 影响范围
      options:
        - /v1/images/generations
        - /v1/images/edits
        - /v1/responses
        - /v1/models
        - /admin
        - Docker deployment
        - Codex skill
        - Unknown
    validations:
      required: true

  - type: input
    id: upstream_type
    attributes:
      label: 上游 BASE_URL 类型
      description: 可脱敏，例如官方 / OpenAI 兼容中转 / 自建网关
      placeholder: OpenAI 兼容中转
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: 服务地址
      description: 请脱敏公网 IP 或域名，保留端口和路径即可
      placeholder: http://SERVER_IP:8787
    validations:
      required: true

  - type: input
    id: image_model
    attributes:
      label: 图像模型 ID
      placeholder: gpt-image-2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述最短复现路径
      placeholder: |
        1. 打开...
        2. 选择...
        3. 点击...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: HTTP 状态码、响应体、后台提示或 skill 输出
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 你原本预期它应该如何工作
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: raw 响应 / 日志 / 截图
      description: 请脱敏后粘贴。不要包含 ADMIN_TOKEN、IMAGE_API_TOKEN、UPSTREAM_API_KEY。
      placeholder: |
        status: 500
        message: ...
    validations:
      required: true
