name: Feature request
description: 自托管 API / 后台 / skill 功能建议
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        这个仓库的 `main` 分支只维护自托管 API、后台、Docker、日志指标和 skill 调用。
        原桌面端、Android 端和安装包功能请到原作者仓库反馈。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述 API 调用、部署、后台管理或 skill 使用中的场景和痛点
      placeholder: 当前在哪个自托管 API 场景下不方便，现有能力缺了什么
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
      placeholder: 希望新增什么接口、后台面板、日志指标、Docker 更新或 skill 能力
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      placeholder: 如果有现有绕路做法、CLI、外部工具或 UI 变通方式，可以写在这里
    validations:
      required: false
