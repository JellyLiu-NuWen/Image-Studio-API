services:
  image-studio-api:
    image: ${IMAGE_STUDIO_API_IMAGE:-ghcr.io/jellyliu-nuwen/image-studio-api}:${IMAGE_STUDIO_API_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: image-studio-api
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      CONFIG_PATH: /data/config.json
      IMAGE_STUDIO_VERSION: ${IMAGE_STUDIO_API_TAG:-dev}
      IMAGE_STUDIO_COMMIT: ${IMAGE_STUDIO_COMMIT:-}
      IMAGE_STUDIO_API_TAG: ${IMAGE_STUDIO_API_TAG:-latest}
      IMAGE_STUDIO_GITHUB_REPOSITORY: ${IMAGE_STUDIO_GITHUB_REPOSITORY:-JellyLiu-NuWen/Image-Studio-API}
    ports:
      - "${IMAGE_STUDIO_API_HOST_PORT:-8787}:8787"
    volumes:
      - image-studio-api-data:/data

volumes:
  image-studio-api-data:
